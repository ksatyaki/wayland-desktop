# Fuzzel launcher (Super+D). Man page: fuzzel.ini(5). Defaults: /etc/xdg/fuzzel/fuzzel.ini
# DOOM Eternal look: same palette as the SDDM login theme (sddm/sddm-astronaut-theme/Themes/doom.conf)
# and the lock screens. Fuzzel only draws rectangles, so the chamfered panels are approximated by
# square corners and a thin lime outline.
[main]
font=Eternal UI:size=14
terminal=tabby
prompt="▶ "
placeholder=SEARCH
icon-theme=breeze-dark
lines=12
width=50
horizontal-pad=24
vertical-pad=14
inner-pad=8
line-height=26
letter-spacing=1

[colors]
# form background (FormBackgroundColor)
background=120404f0
# typed text, list text (LoginFieldTextColor / DateTextColor)
input=dcf28aff
text=ffb347ff
# prompt marker and hint text (UserIconColor / PlaceholderTextColor)
prompt=a9d43aff
placeholder=7f9a3cff
# matched characters (WarningColor red)
match=ff3b1fff
# highlighted entry: orange with dark text, like the Login button (LoginButtonBackgroundColor)
selection=f2861cff
selection-text=1c0e00ff
selection-match=120404ff
counter=7f9a3cff
# outline (FieldBorderColor)
border=a9d43aff

[border]
width=2
radius=0

