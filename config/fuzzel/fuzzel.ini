# Fuzzel launcher (Super+D). Man page: fuzzel.ini(5). Defaults: /etc/xdg/fuzzel/fuzzel.ini
[main]
font=Eternal UI:size=14
terminal=tabby
prompt="  "
icon-theme=breeze-dark
lines=12
width=50
horizontal-pad=20
vertical-pad=12
inner-pad=6

[colors]
# Catppuccin Mocha, same as the bar
background=1e1e2eee
text=cdd6f4ff
prompt=bac2deff
placeholder=7f849cff
input=cdd6f4ff
match=f38ba8ff
selection=585b70ff
selection-text=cdd6f4ff
selection-match=f38ba8ff
counter=7f849cff
border=b4befeff

[border]
width=2
radius=8
