# DOOM lock screen: same wallpaper and font as the SDDM login theme, Eternal-style chamfered panels
$font  = Eternal UI
$hfont = Eternal UI 2      # header and clock, bold weight is the caps-only slashed-O face
$wall  = ~/Pictures/Wallpapers/DOOM95.jpeg

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = $wall
    blur_passes = 2
    blur_size = 4
    brightness = 0.7
}

# Eternal-style chamfered panel behind the password field (hyprlock can only draw rectangles, so the
# shape is a PNG rendered by tools/eternal-panel.py in the repo). The input-field itself is transparent:
# it only contributes the dots, the placeholder and the red outline on a failed attempt.
image {
    monitor =
    path = ~/.config/hypr/eternal-input.png
    size = 70
    rounding = 0
    border_size = 0
    position = 0, -90
    halign = center
    valign = center
    zindex = 0
}

input-field {
    monitor =
    size = 380, 40
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0)
    outer_color = rgba(0, 0, 0, 0)
    check_color = rgba(255, 179, 71, 0.95)
    fail_color  = rgba(255, 59, 31, 0.95)
    font_color  = rgb(220, 242, 138)
    font_family = $font
    fade_on_empty = false
    rounding = 0
    placeholder_text = <span foreground="##7f9a3c">PASSWORD</span>
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -90
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = <b>RIP AND TEAR</b>
    font_size = 28
    font_family = $hfont
    color = rgb(255, 59, 31)
    position = 0, 230
    halign = center
    valign = center
}

label {
    monitor =
    text = <b>$TIME</b>
    font_size = 110
    font_family = $hfont
    color = rgb(255, 233, 196)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 22
    font_family = $font
    color = rgb(255, 179, 71)
    position = 0, 30
    halign = center
    valign = center
}

# keyboard layout in a small hexagonal Eternal card
image {
    monitor =
    path = ~/.config/hypr/eternal-layout.png
    size = 40
    rounding = 0
    border_size = 0
    position = 0, -165
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor =
    text = $LAYOUT
    font_size = 14
    font_family = $font
    color = rgb(169, 212, 58)
    onclick = hyprctl switchxkblayout all next
    position = 0, -165
    halign = center
    valign = center
    zindex = 1
}
