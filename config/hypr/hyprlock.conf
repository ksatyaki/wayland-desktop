# DOOM lock screen: same wallpaper and font as the SDDM login theme
$font  = Eternal UI
$wall  = ~/Pictures/Wallpapers/DOOM95.jpeg

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = $wall
    blur_passes = 2
    blur_size = 4
    brightness = 0.7
}

input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    inner_color = rgba(18, 4, 4, 0.92)
    outer_color = rgba(255, 106, 43, 0.95)
    check_color = rgba(255, 179, 71, 0.95)
    fail_color  = rgba(255, 59, 31, 0.95)
    font_color  = rgb(255, 233, 196)
    font_family = $font
    fade_on_empty = false
    rounding = 4
    placeholder_text = <span foreground="##9c5a3c">password</span>
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -90
    halign = center
    valign = center
}

label {
    monitor =
    text = RIP AND TEAR
    font_size = 28
    font_family = $font
    color = rgb(255, 59, 31)
    position = 0, 230
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 110
    font_family = $font
    color = rgb(255, 233, 196)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 22
    font_family = $font
    color = rgb(255, 179, 71)
    position = 0, 30
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    font_size = 14
    font_family = $font
    color = rgb(156, 90, 60)
    onclick = hyprctl switchxkblayout all next
    position = 0, -160
    halign = center
    valign = center
}
