version: 8

# Minimal Tabby config: only what differs from Tabby's own defaults.
# Everything else is left unset so Tabby upgrades can move its defaults.

terminal:
  font: DejaVu Sans Mono
  fontSize: 14

  # Tabby's stock scheme uses a grey foreground (#cacaca). These use a true
  # white on dark and a true black on light.
  colorScheme:
    name: Plain Dark
    foreground: '#ffffff'
    background: '#121212'
    cursor: '#ffffff'
    cursorAccent: '#121212'
    selection: '#3a5e8c'
    colors:
      - '#121212'
      - '#e06c6c'
      - '#6cc46c'
      - '#d8b45a'
      - '#6ba8f5'
      - '#c58ae0'
      - '#5cc8c8'
      - '#c8c8c8'
      - '#6a6a6a'
      - '#ff8c8c'
      - '#8ce08c'
      - '#f0d070'
      - '#92c2ff'
      - '#dcaaf0'
      - '#7ee0e0'
      - '#ffffff'

  lightColorScheme:
    name: Plain Light
    foreground: '#000000'
    background: '#ffffff'
    cursor: '#000000'
    cursorAccent: '#ffffff'
    selection: '#b8d4f0'
    colors:
      - '#000000'
      - '#b02020'
      - '#1f7a2e'
      - '#8a6000'
      - '#1a4fbf'
      - '#8a2fa8'
      - '#0f6f80'
      - '#5c5c5c'
      - '#8a8a8a'
      - '#d03030'
      - '#2a9440'
      - '#a87400'
      - '#2a66d8'
      - '#a63fc4'
      - '#158798'
      - '#000000'

appearance:
  # Tabby already defaults to opaque; pinned because a translucent window makes
  # subpixel antialiasing impossible (per-channel coverage needs a known opaque
  # background), and that failure is invisible until measured.
  opacity: 1.0
  vibrancy: false
