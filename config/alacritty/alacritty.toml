# Colours are mate-terminal's default profile, read from
# /org/mate/terminal/profiles/default/ : the VGA/Linux-console palette on a
# cream background. Dark-on-light is also the polarity the Fedora 8 hinting
# was tuned for (see ~/.config/fontconfig/fonts.conf and hyprland.lua).

[font]
# Alacritty converts points at 96 DPI: 11pt = ~14.7px.
size = 11

[font.normal]
family = "DejaVu Sans Mono"
style = "Book"

# mate-terminal sets allow-bold = false, so bold uses the regular face and the
# normal colour. draw_bold_text_with_bright_colors is deliberately NOT set:
# against this cream background the bright palette is unreadable (bright yellow
# measures 1.05:1, bright white 1.02:1).
[font.bold]
family = "DejaVu Sans Mono"
style = "Book"

[font.italic]
family = "DejaVu Sans Mono"
style = "Oblique"

[font.bold_italic]
family = "DejaVu Sans Mono"
style = "Oblique"

[cursor]
style = { shape = "Beam", blinking = "On" }

[colors.primary]
background = "#ffffdd"
foreground = "#000000"

[colors.cursor]
text   = "#ffffdd"
cursor = "#000000"

[colors.normal]
black   = "#000000"
red     = "#aa0000"
green   = "#00aa00"
yellow  = "#aa5500"
blue    = "#0000aa"
magenta = "#aa00aa"
cyan    = "#00aaaa"
white   = "#aaaaaa"

[colors.bright]
black   = "#555555"
red     = "#ff5555"
green   = "#55ff55"
yellow  = "#ffff55"
blue    = "#5555ff"
magenta = "#ff55ff"
cyan    = "#55ffff"
white   = "#ffffff"
