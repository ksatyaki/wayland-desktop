# Classic VGA/Linux-console palette, taken from mate-terminal's default profile
# (/org/mate/terminal/profiles/default/). Dark amber variant is active; the
# light cream variant is at the bottom, commented out. Swap by commenting one
# block and uncommenting the other.

[font]
# Alacritty converts points at 96 DPI: 11pt = ~14.7px.
size = 10.5

[font.normal]
family = "DejaVu Sans Mono"
style = "Book"

# Bold shows through the bright colours rather than DejaVu's Bold face, so the
# bold slots deliberately point at the regular and oblique faces.
[font.bold]
family = "DejaVu Sans Mono"
style = "Book"

[font.italic]
family = "DejaVu Sans Mono"
style = "Oblique"

[font.bold_italic]
family = "DejaVu Sans Mono"
style = "Oblique"

[window]
opacity = 0.6

[cursor]
style = { shape = "Beam", blinking = "On" }

# ---------------------------------------------------------------- DARK (active)
# Gold on black: 14.97:1. Lighter alternatives: #ffe066 (16.11:1),
# #ffff55 (19.69:1, the palette's own bright yellow); darker: #ffcc00, #ffb000. Bold uses the bright palette, which matters because
# ls paints directories 01;34 and normal blue on black is only 1.58:1; as bright
# blue it is 4.13:1.
[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#000000"
foreground = "#ffffcc"

[colors.cursor]
text   = "#000000"
cursor = "#ffd700"

[colors.normal]
black   = "#000000"
red     = "#aa0000"
green   = "#00aa00"
yellow  = "#aa5500"
blue    = "#0000aa"
magenta = "#aa00aa"
cyan    = "#00aaaa"
white   = "#aaaaaa"

[colors.bright]
black   = "#555555"
red     = "#ff5555"
green   = "#55ff55"
yellow  = "#ffff55"
blue    = "#5555ff"
magenta = "#ff55ff"
cyan    = "#55ffff"
white   = "#ffffff"

# --------------------------------------------------------------- LIGHT (unused)
# mate-terminal's actual defaults: cream background, black text. If you enable
# this, also set draw_bold_text_with_bright_colors = false above: against cream
# the bright palette is unreadable (bright yellow 1.05:1, bright white 1.02:1).
#
# [colors.primary]
# background = "#ffffdd"
# foreground = "#000000"
#
# [colors.cursor]
# text   = "#ffffdd"
# cursor = "#000000"
