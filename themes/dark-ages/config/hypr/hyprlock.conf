# DOOM: The Dark Ages lock screen: the Revelations key art behind a dark blur, the Cormorant serif, and the menu
# rows of the game: "STAND AND FIGHT" over a fading rule, the password field on the orange spear-tipped bar of a
# focused row, the keyboard layout on a small teal one. Palette: themes/dark-ages/README.md.
$font = Cormorant
$wall = ~/Pictures/Wallpapers/revelations.jpg

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = $wall
    blur_passes = 3
    blur_size = 6
    brightness = 0.45
    contrast = 0.95
    vibrancy = 0.1
}

# hyprlock only draws rectangles, so the bars and the rule are PNGs rendered by tools/dark-ages-assets.py in the
# repo. The input-field itself is transparent: it contributes the dots, the placeholder and the failure outline.
image {
    monitor =
    path = ~/.config/hypr/dark-ages-input.png
    size = 64
    rounding = 0
    border_size = 0
    position = 0, -100
    halign = center
    valign = center
    zindex = 0
}

input-field {
    monitor =
    size = 500, 56
    outline_thickness = 0
    inner_color = rgba(0, 0, 0, 0)
    outer_color = rgba(0, 0, 0, 0)
    check_color = rgba(255, 154, 92, 0.9)
    fail_color  = rgba(255, 90, 54, 0.9)
    font_color  = rgb(255, 246, 238)
    font_family = $font
    fade_on_empty = false
    rounding = 0
    placeholder_text = <span foreground="##ffb98a" weight="600" size="x-large">Password</span>
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -100
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = <span weight="600" letter_spacing="4096">STAND AND FIGHT</span>
    font_size = 26
    font_family = $font
    color = rgb(164, 192, 193)
    position = 0, 240
    halign = center
    valign = center
}

# fading rule with a four-pointed star at each end, under the header
image {
    monitor =
    path = ~/.config/hypr/dark-ages-rule.png
    size = 16
    rounding = 0
    border_size = 0
    position = 0, 208
    halign = center
    valign = center
}

label {
    monitor =
    text = <span weight="600" font_features="lnum">$TIME</span>
    font_size = 110
    font_family = $font
    color = rgb(232, 244, 243)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    # lining digits: hyprlock ignores the fontconfig rule and eats a $(...) in a cmd, hence the backticks
    text = cmd[update:60000] printf '<span font_features="lnum">%s</span>' "`date +'%A, %-d %B'`"
    font_size = 24
    font_family = $font
    color = rgb(164, 190, 191)
    position = 0, 30
    halign = center
    valign = center
}

# keyboard layout on a small teal bar (the lit row of the game's dropdowns)
image {
    monitor =
    path = ~/.config/hypr/dark-ages-layout.png
    size = 32
    rounding = 0
    border_size = 0
    position = 0, -190
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor =
    text = <span weight="600">$LAYOUT</span>
    font_size = 15
    font_family = $font
    color = rgb(232, 244, 243)
    onclick = hyprctl switchxkblayout all next
    position = 0, -190
    halign = center
    valign = center
    zindex = 1
}
