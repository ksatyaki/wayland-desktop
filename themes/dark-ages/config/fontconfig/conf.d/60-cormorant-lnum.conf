<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<!-- DOOM: The Dark Ages theme: Cormorant defaults to old-style (descending) digits; the game's menus use lining
     figures, so ask for them everywhere the font is used (bar, launcher, notifications, lock screen). -->
<fontconfig>
 <match target="font">
  <test name="family"><string>Cormorant</string></test>
  <edit name="fontfeatures" mode="append"><string>lnum</string></edit>
 </match>
</fontconfig>
