# Fuzzel launcher (Super+D), DOOM: The Dark Ages look. Man page: fuzzel.ini(5). Defaults: /etc/xdg/fuzzel/fuzzel.ini
# Same palette as the Dark Ages login screen (sddm/sddm-dark-ages-theme/Themes/dark_ages.conf), the bar and the lock
# screens: dark teal stone, pale text, a hairline frame, the selected entry in the orange of the focused menu row.
[main]
font=Cormorant:weight=semibold:size=16:fontfeatures=lnum
terminal=alacritty
prompt="◆ "
placeholder=Search
icon-theme=breeze-dark
lines=12
width=50
horizontal-pad=28
vertical-pad=16
inner-pad=10
line-height=28
letter-spacing=0

[colors]
# stone (FormBackgroundColor)
background=0a2022f2
# typed text / list text (LoginFieldTextColor / DateTextColor)
input=e8f4f3ff
text=a4bebfff
# prompt marker and hint text (HighlightBorderColor / PlaceholderTextColor)
prompt=7fb3aeff
placeholder=5f7f80ff
# matched characters: the warning orange
match=ff9a5cff
# highlighted entry: the orange focused-row bar, pale text
selection=4a2a20ff
selection-text=fff6eeff
selection-match=ff9a5cff
counter=5f7f80ff
# hairline frame (HeaderRuleColor)
border=365557ff

[border]
width=1
radius=0
